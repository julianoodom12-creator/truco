<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bar do Broco -- Truco Paranaense</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;background:radial-gradient(circle at 50% 30%,#1d3a24 0%,#0a1a0f 100%);color:#f0e6d2;user-select:none}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100vh;padding-bottom:38px}

.hud{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:rgba(20,10,5,.85);border-bottom:2px solid #3a2618;gap:8px;flex-wrap:wrap;backdrop-filter:blur(4px)}
.team{display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:10px;border:2px solid transparent;transition:border-color .2s;min-width:150px}
.team.teamA{border-color:#dc2626}
.team.teamB{border-color:#2563eb}
.team.active{border-color:#facc15;box-shadow:0 0 14px rgba(250,204,21,.5)}
.tname{font-weight:bold;font-size:12px}
.tscore{font-size:22px;font-weight:900;color:#facc15;font-variant-numeric:tabular-nums}
.center-info{text-align:center;flex:1;min-width:130px}
.status{font-size:13px;color:#facc15;font-weight:bold}
.substatus{font-size:11px;color:#c9b28a;margin-top:2px;height:14px;line-height:14px}

.table{position:relative;display:flex;align-items:center;justify-content:center;padding:10px;min-height:0;overflow:hidden}
.felt{position:absolute;inset:14px;border-radius:50% 50% 40% 40% / 30% 30% 25% 25%;background:radial-gradient(ellipse at 50% 30%,#1d5c2f 0%,#0d3a1c 70%,#062010 100%);box-shadow:inset 0 0 120px rgba(0,0,0,.6);border:12px solid #3a2418}
.play-area{position:relative;z-index:2;width:100%;height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:8px;padding:10px;padding-bottom:70px}

.hand-label{font-size:10px;color:#c9b28a;text-transform:uppercase;letter-spacing:1px;text-align:center;margin-bottom:2px}
.hand{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;min-height:56px;align-items:center}

.mesa{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;justify-items:center;padding:8px;background:rgba(0,0,0,.25);border-radius:14px;border:2px dashed rgba(250,204,21,.25);min-height:130px}
.mesa-center{display:flex;flex-direction:column;align-items:center;gap:6px}
.mesa-side{display:flex;flex-direction:column;align-items:center;gap:4px}
.mesa-cards{display:flex;gap:4px;min-height:80px;align-items:center}
.mesa-label{font-size:10px;color:#c9b28a;text-transform:uppercase;letter-spacing:1px;min-height:14px}
.vira-label{font-size:10px;color:#facc15;font-weight:bold;text-transform:uppercase;letter-spacing:1px}
.vira-slot{display:flex;flex-direction:column;align-items:center;gap:2px}
.manilha-hint{font-size:9px;color:#c9b28a;font-style:italic;text-align:center;margin-top:2px;min-height:12px}

.card{width:58px;height:84px;border-radius:8px;background:#fffdf5;border:2px solid #1a1a1a;position:relative;box-shadow:0 3px 8px rgba(0,0,0,.4);transition:transform .15s,box-shadow .15s;cursor:pointer;flex-shrink:0}
.card:hover{transform:translateY(-6px);box-shadow:0 8px 18px rgba(0,0,0,.5)}
.card.disabled{cursor:not-allowed;opacity:.5}
.card.disabled:hover{transform:none;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.card.back{background:repeating-linear-gradient(45deg,#5a1a1a,#5a1a1a 6px,#7a2a2a 6px,#7a2a2a 12px);border-color:#1a1a1a}
.card.back::after{content:'🂠';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;color:rgba(255,255,255,.35)}
.card.manilha{border-color:#facc15;box-shadow:0 0 12px rgba(250,204,21,.7)}
.card .stl,.card .sbr{position:absolute;font-size:15px;line-height:1;font-weight:bold}
.card .stl{top:3px;left:5px}
.card .sbr{bottom:3px;right:5px;transform:rotate(180deg)}
.card .rk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900}
.card .sc{position:absolute;top:50%;left:50%;transform:translate(-50%,50%);font-size:16px}
.card.red .stl,.card.red .sbr,.card.red .sc,.card.red .rk{color:#c02020}
.card.black .stl,.card.black .sbr,.card.black .sc,.card.black .rk{color:#1a1a1a}
.card.small{width:44px;height:64px}
.card.small .rk{font-size:22px}
.card.small .stl,.card.small .sbr{font-size:12px}
.card.small .sc{font-size:12px}

.controls{
  position:absolute;
  bottom:14px;
  left:14px;
  z-index:10;
  display:flex;
  flex-direction:row;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
  pointer-events:none;
  max-width:calc(100% - 28px);
}
.controls > *{pointer-events:auto}
.btn{
  padding:10px 16px;
  font-size:13px;
  font-weight:bold;
  border:none;
  border-radius:22px;
  cursor:pointer;
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  color:#fff;
  font-family:inherit;
  transition:transform .1s,filter .1s;
  letter-spacing:.3px;
  box-shadow:0 4px 12px rgba(0,0,0,.55);
  white-space:nowrap;
}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:scale(.95)}
.btn.secondary{background:linear-gradient(135deg,#475569,#64748b)}
.btn.gold{background:linear-gradient(135deg,#f59e0b,#facc15);color:#1a120a}
.btn.danger{background:linear-gradient(135deg,#b91c1c,#ef4444);box-shadow:0 4px 14px rgba(239,68,68,.6)}
.btn.danger:hover{box-shadow:0 6px 18px rgba(239,68,68,.85);filter:brightness(1.15)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn:disabled:hover{filter:none}
.btn.big{padding:12px 20px;font-size:14px}
.btn.icon-btn{padding:10px 14px;font-size:16px;border-radius:50%;width:42px;height:42px;display:flex;align-items:center;justify-content:center;line-height:1}

.start{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#2a1a10 0%,#0d0805 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;gap:10px;padding:24px 24px 70px;overflow-y:auto;transition:opacity .35s}
.start.hide{opacity:0;pointer-events:none}
.title{font-size:34px;font-weight:900;background:linear-gradient(90deg,#facc15,#fb923c,#ef4444,#a855f7,#3b82f6,#16a34a,#facc15);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rgb 6s linear infinite;text-align:center;line-height:1.05}
@keyframes rgb{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.subtitle{color:#c9b28a;font-size:12px;font-style:italic;margin-bottom:4px;text-align:center;max-width:520px}
.group-label{color:#8a7554;font-size:10px;letter-spacing:2px;text-transform:uppercase;margin:6px 0 2px}
.mode-btn{padding:11px 24px;font-size:13px;font-weight:bold;border:2px solid #facc15;border-radius:12px;background:transparent;color:#facc15;font-family:inherit;cursor:pointer;transition:all .2s;min-width:290px}
.mode-btn:hover{background:#facc15;color:#1a120a;transform:scale(1.03)}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:220;backdrop-filter:blur(4px);padding:20px}
.modal.show{display:flex}
.modal-box{background:#241812;padding:26px 32px;border-radius:18px;border:3px solid #facc15;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.8);animation:pop .35s;max-width:92vw}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.modal-box h2{font-size:24px;color:#facc15;margin-bottom:10px}
.modal-box p{font-size:13px;color:#c9b28a;margin-bottom:16px}
.modal-box .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

.footer{background:#120c07;border-top:2px solid #3a2618;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px}
.footer-always{position:fixed;bottom:0;left:0;right:0;z-index:210;background:#120c07;border-top:2px solid #3a2618;padding:6px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px}
.credit{font-weight:bold;background:linear-gradient(90deg,#facc15,#fb923c,#ef4444,#a855f7,#3b82f6,#16a34a,#facc15);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rgb 6s linear infinite;letter-spacing:.5px;text-decoration:none;cursor:pointer;transition:filter .15s}
.credit:hover{filter:brightness(1.35);text-decoration:underline}
.visits{display:flex;align-items:center;gap:6px;color:#c9b28a}
.visits-num{color:#facc15;font-weight:bold;font-variant-numeric:tabular-nums}

.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(30px);background:rgba(0,0,0,.92);color:#facc15;padding:10px 22px;border-radius:24px;font-size:13px;font-weight:bold;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:150;border:2px solid #facc15;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.float-msg{
  position:fixed;
  left:50%;
  top:40%;
  transform:translate(-50%,0);
  font-size:52px;
  font-weight:900;
  color:#22ff55;
  text-shadow:0 0 12px #00ff44, 0 0 24px #00cc33, 0 4px 8px rgba(0,0,0,.9);
  letter-spacing:2px;
  pointer-events:none;
  z-index:180;
  opacity:0;
  animation:floatUp 2s ease-out forwards;
  white-space:nowrap;
  font-family:'Impact','Segoe UI Black',system-ui,sans-serif;
  -webkit-text-stroke:2px #003a00;
  text-align:center;
}
@keyframes floatUp{
  0%   { opacity:0; transform:translate(-50%,30px) scale(.6); }
  15%  { opacity:1; transform:translate(-50%,0) scale(1.15); }
  30%  { transform:translate(-50%,-8px) scale(1); }
  75%  { opacity:1; transform:translate(-50%,-80px) scale(1); }
  100% { opacity:0; transform:translate(-50%,-140px) scale(.95); }
}
@media(max-width:820px){
  .float-msg{ font-size:36px; }
}

@media(max-width:820px){
 .card{width:48px;height:70px}
 .card .rk{font-size:22px}
 .card .stl,.card .sbr{font-size:12px}
 .card.small{width:36px;height:52px}
 .title{font-size:22px}
 .mode-btn{padding:10px 16px;font-size:12px;min-width:250px}
 .btn{padding:9px 14px;font-size:12px}
 .btn.big{padding:11px 16px;font-size:13px}
 .btn.icon-btn{width:38px;height:38px;padding:8px}
 .play-area{ padding-bottom:60px; }
}
</style>
</head>
<body>

<div class="start" id="startScreen">
  <h1 class="title">BAR DO BROCO<br>TRUCO PARANAENSE</h1>
  <div class="subtitle">baralho espanhol 40 cartas · vira e manilhas · truco/6/9/12 · mão de 12</div>

  <div class="group-label">-- 1v1 --</div>
  <button class="mode-btn" data-mode="cpu1v1">🤖 1 Jogador vs CPU</button>

  <div class="group-label">-- Duplas (2v2) --</div>
  <button class="mode-btn" data-mode="cpu">🤖 1 Jogador + 3 CPU (duplas)</button>
</div>

<footer class="footer-always">
  <a class="credit" href="https://julianoodom12-creator.github.io/domwebsite-loja-virtual/" target="_blank" rel="noopener">💻 Desenvolvido por DomWebsite</a>
  <div class="visits">👁️ Visualizações: <span class="visits-num visits-num-2">--</span></div>
</footer>

<div class="app" id="app" style="display:none">
  <header class="hud">
    <div class="team teamB" id="teamB">
      <div><div class="tname" id="nameTeamB">Adversário</div></div>
      <div class="tscore" id="scoreTeamB">0</div>
    </div>
    <div class="center-info">
      <div class="status" id="status">--</div>
      <div class="substatus" id="substatus"></div>
    </div>
    <div class="team teamA" id="teamA">
      <div class="tscore" id="scoreTeamA">0</div>
      <div><div class="tname" id="nameTeamA">Você</div></div>
    </div>
  </header>

  <main class="table">
    <div class="felt"></div>

    <footer class="controls" id="controls"></footer>

    <div class="play-area">
      <div>
        <div class="hand-label" id="labelOpp">Adversário</div>
        <div class="hand" id="oppHand"></div>
      </div>

      <div class="mesa" id="mesa">
        <div class="mesa-side" id="mesaLeft"></div>
        <div class="mesa-center">
          <div class="vira-slot">
            <div class="vira-label">VIRA</div>
            <div id="viraCard"></div>
            <div class="manilha-hint" id="manilhaHint"></div>
          </div>
        </div>
        <div class="mesa-side" id="mesaRight"></div>
      </div>

      <div>
        <div class="hand-label" id="labelMe">Sua mão</div>
        <div class="hand" id="myHand"></div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <a class="credit" href="https://julianoodom12-creator.github.io/domwebsite-loja-virtual/" target="_blank" rel="noopener">💻 Desenvolvido por DomWebsite</a>
    <div class="visits">👁️ Visualizações: <span class="visits-num" id="visitsNum">--</span></div>
  </footer>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h2 id="modalTitle">--</h2>
    <p id="modalSub">--</p>
    <div class="row" id="modalActions"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   TRUCO PARANAENSE -- 4 modos
   ============================================================ */

const SUIT_ORDER = { oro: 0, espada: 1, copa: 2, pau: 3 };
const SUITS = [
  { id:'oro',    sym:'🪙', color:'red'   },
  { id:'espada', sym:'⚔️', color:'black' },
  { id:'copa',   sym:'🏆', color:'red'   },
  { id:'pau',    sym:'🌿', color:'black' }
];

const VALUES = [1,2,3,4,5,6,7,10,11,12];
const VALUE_ORDER = { 3:10, 2:9, 1:8, 12:7, 11:6, 10:5, 7:4, 6:3, 5:2, 4:1 };
const VALUE_NAME = { 1:'Ás', 10:'Dama', 11:'Valete', 12:'Rei' };

const LEVEL_PTS  = { 0: 1,  1: 3,  2: 6,  3: 9,  4: 12 };
const LEVEL_NAME = { 0: 'Mão', 1: 'Truco', 2: 'Seis', 3: 'Nove', 4: 'Doze' };

const VOZ = {
  base: 'voz/',
  enabled: true,
  unlocked: false,
  cache: {},

  preload(nome) {
    if (this.cache[nome]) return this.cache[nome];
    try {
      const a = new Audio(this.base + nome + '.mp3');
      a.preload = 'auto';
      a.volume = 0.9;
      this.cache[nome] = a;
      return a;
    } catch (e) { return null; }
  },

  play(nome) {
    if (!this.enabled) return;
    try {
      let a = this.cache[nome];
      if (!a) {
        a = new Audio(this.base + nome + '.mp3');
        a.volume = 0.9;
        this.cache[nome] = a;
      }
      a.currentTime = 0;
      const p = a.play();
      if (p && p.catch) {
        p.catch(err => {
          console.warn('[VOZ] Falha ao tocar:', nome, '-', err && err.name);
          if (err && err.name === 'NotAllowedError') this.unlockNextClick();
        });
      }
    } catch (e) {
      console.warn('[VOZ] Exceção:', nome, e);
    }
  },

  playSeq(nome, vezes = 2, delayMs = 550) {
    if (!this.enabled) return;
    for (let i = 0; i < vezes; i++)
      setTimeout(() => this.play(nome), i * delayMs);
  },

  unlockNextClick() {
    if (this.unlocked) return;
    const handler = () => {
      try {
        const a = new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAAAA');
        a.volume = 0;
        a.play().then(() => { this.unlocked = true; }).catch(() => {});
      } catch (e) {}
      document.removeEventListener('click', handler);
      document.removeEventListener('touchstart', handler);
    };
    document.addEventListener('click', handler, { once: true });
    document.addEventListener('touchstart', handler, { once: true });
  },

  preloadAll() {
    ['truco','seis','nove','doze','vai-caganera','nao-vou-querer-seu-facao','caganera-caganera','vitoria']
      .forEach(n => this.preload(n));
    this.unlockNextClick();
  }
};

if (document.readyState === 'complete') VOZ.preloadAll();
else window.addEventListener('load', () => VOZ.preloadAll());

function flutuar(txt, cor = '#22ff55') {
  const el = document.createElement('div');
  el.className = 'float-msg';
  el.textContent = txt;
  el.style.color = cor;
  el.style.textShadow = `0 0 12px ${cor}, 0 0 24px ${cor}, 0 4px 8px rgba(0,0,0,.9)`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2100);
}

function buildDeck() {
  const deck = [];
  for (const s of SUITS)
    for (const v of VALUES)
      deck.push({ id: `${v}-${s.id}`, rank: v, suit: s.id, sym: s.sym, color: s.color });
  return deck;
}

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function manilhaValueFromVira(vira) {
  const order = [4,5,6,7,10,11,12,1,2,3];
  const rank = parseInt(vira.rank, 10);
  let idx = order.indexOf(rank);
  if (idx === -1) idx = 0;
  return order[(idx + 1) % order.length];
}

/* ============================================================
   FORÇA DA CARTA
   · manilha: 1000 + naipe
   · comum:   valor*10 + naipe (máximo = 3 de paus = 103)
   Manilha sempre vence qualquer carta comum.
   ============================================================ */
function cardStrength(card, manilhaValue) {
  const rank = parseInt(card.rank, 10);
  const man  = parseInt(manilhaValue, 10);
  if (!isNaN(man) && rank === man) return 1000 + SUIT_ORDER[card.suit];
  const vo = VALUE_ORDER[rank];
  if (vo === undefined) return SUIT_ORDER[card.suit];
  return vo * 10 + SUIT_ORDER[card.suit];
}

/* retorna true se a carta é manilha */
function isManilha(card, manilhaValue) {
  const rank = parseInt(card.rank, 10);
  const man  = parseInt(manilhaValue, 10);
  return !isNaN(man) && rank === man;
}

const G = {
  mode: 'cpu1v1',
  seats: ['me','p2','p3','p4'],
  teamOf: { me:'A', p2:'B', p3:'A', p4:'B' },
  seatName: { me:'Você', p2:'P2', p3:'P3', p4:'P4' },

  hands: { me:[], p2:[], p3:[], p4:[] },
  scores: { A: 0, B: 0 },
  round: 1,
  vira: null,
  manilhaValue: null,

  trickNum: 1,
  trickWins: { A: 0, B: 0 },
  trickWinner: [null, null, null],
  roundShortCircuit: false,
  cardsOnTable: [],
  turnIdx: 0,

  currentLevel: 0,
  negotiation: null,
  lastRaiserTeam: null,

  roundOver: false,
  gameOver: false,

  is1v1() { return this.mode === 'cpu1v1' || this.mode === 'local2'; },
  activeSeats() { return this.is1v1() ? ['me','p2'] : ['me','p2','p3','p4']; },

  reset() {
    this.deck = shuffle(buildDeck());
    const active = this.activeSeats();
    for (const s of this.seats) this.hands[s] = [];
    for (let i = 0; i < 3; i++)
      for (const s of active) this.hands[s].push(this.deck.shift());
    this.vira = this.deck.shift();
    this.manilhaValue = manilhaValueFromVira(this.vira);

    this.trickNum = 1;
    this.trickWins = { A:0, B:0 };
    this.trickWinner = [null, null, null];
    this.roundShortCircuit = false;
    this.cardsOnTable = [];
    this.turnIdx = 0;
    this.currentLevel = 0;
    this.negotiation = null;
    this.lastRaiserTeam = null;
    this.roundOver = false;

    this.render();
    this.scheduleCpuIfNeeded();
  },

  currentSeat() { return this.seats[this.turnIdx]; },

  isCpuSeat(seat) {
    if (this.mode === 'cpu' || this.mode === 'cpu1v1') return seat !== 'me';
    return false;
  },

  isHumanSeat(seat) {
    if (this.mode === 'local' || this.mode === 'local2') return true;
    return seat === 'me';
  },

  humanTeam() {
    if (this.mode === 'cpu' || this.mode === 'cpu1v1') return 'A';
    return this.teamOf[this.currentSeat()] || 'A';
  },

  isCpuTurn() { return this.isCpuSeat(this.currentSeat()); },

  cardHTML(card, extra = '', size = '') {
    if (!card) return '';
    if (card._back) return `<div class="card back ${size} ${extra}"></div>`;
    const im = this.manilhaValue !== null && isManilha(card, this.manilhaValue);
    const cls = `card ${card.color} ${size} ${extra} ${im ? 'manilha' : ''}`;
    const rankDisplay = card.rank === 10 ? 'Q' : card.rank === 11 ? 'J' : card.rank === 12 ? 'K' : card.rank;
    return `<div class="${cls}" data-id="${card.id}">
      <div class="stl">${card.sym}</div>
      <div class="rk">${rankDisplay}</div>
      <div class="sc">${card.sym}</div>
      <div class="sbr">${card.sym}</div>
    </div>`;
  },

  teamLabel(t) { return t === 'A' ? 'Dupla A' : 'Dupla B'; },

  seatDisplay(seat) {
    if (this.mode === 'local' || this.mode === 'local2') return this.seatName[seat];
    if (seat === 'me') return 'Você';
    if (seat === 'p2') return 'CPU Adv.1';
    if (seat === 'p3') return 'CPU Parceiro';
    return 'CPU Adv.2';
  },

  render() {
    document.getElementById('scoreTeamA').textContent = this.scores.A;
    document.getElementById('scoreTeamB').textContent = this.scores.B;

    const labelA =
      this.mode === 'cpu1v1' ? 'Você' :
      this.mode === 'local2' ? 'P1' :
      this.mode === 'cpu' ? 'Você + Parceiro CPU' :
      'Dupla A (P1+P3)';
    const labelB =
      this.mode === 'cpu1v1' ? 'CPU 🤖' :
      this.mode === 'local2' ? 'P2' :
      this.mode === 'cpu' ? 'CPU A + CPU B' :
      'Dupla B (P2+P4)';
    document.getElementById('nameTeamA').textContent = labelA;
    document.getElementById('nameTeamB').textContent = labelB;

    const activeSeat = this.currentSeat();
    const activeTeam = this.teamOf[activeSeat];
    document.getElementById('teamA').classList.toggle('active', activeTeam === 'A' && !this.roundOver);
    document.getElementById('teamB').classList.toggle('active', activeTeam === 'B' && !this.roundOver);

    const oppSeats = this.activeSeats().filter(s => s !== 'me');
    let oppHTML = '';
    for (const s of oppSeats) for (const _ of this.hands[s]) oppHTML += this.cardHTML({_back:true}, '', 'small');
    document.getElementById('oppHand').innerHTML = oppHTML;
    document.getElementById('labelOpp').textContent = oppSeats.length === 1 ? 'Adversário' : 'Adversários';

    const canPlay = this.canHumanPlayNow();
    const myEl = document.getElementById('myHand');
    myEl.innerHTML = this.hands.me.map(c => this.cardHTML(c, canPlay ? '' : 'disabled')).join('');
    myEl.querySelectorAll('.card').forEach(el => {
      el.onclick = () => {
        if (!this.canHumanPlayNow()) return;
        const card = this.hands.me.find(c => c.id === el.dataset.id);
        if (card) this.playCard('me', card);
      };
    });

    document.getElementById('viraCard').innerHTML = this.vira ? this.cardHTML(this.vira, '', 'small') : '';
    const manilhaNome = VALUE_NAME[this.manilhaValue] || this.manilhaValue;
    document.getElementById('manilhaHint').textContent = `manilhas: ${manilhaNome}`;

    const active = this.activeSeats();
    const leftSeats  = ['me','p3'].filter(s => active.includes(s));
    const rightSeats = ['p2','p4'].filter(s => active.includes(s));
    const leftEl = document.getElementById('mesaLeft');
    const rightEl = document.getElementById('mesaRight');
    leftEl.innerHTML = '';
    rightEl.innerHTML = '';
    for (const seat of leftSeats) {
      const played = this.cardsOnTable.find(c => c.seat === seat);
      const lbl = seat === 'me' ? 'Você' : (this.mode === 'cpu' ? 'Parceiro CPU' : 'P3');
      leftEl.innerHTML += `<div class="mesa-label">${lbl}</div><div class="mesa-cards">${played ? this.cardHTML(played.card, '', 'small') : '<div class="card small" style="opacity:.15;background:transparent;border:2px dashed #555;box-shadow:none;cursor:default"></div>'}</div>`;
    }
    for (const seat of rightSeats) {
      const played = this.cardsOnTable.find(c => c.seat === seat);
      const lbl = (this.mode === 'cpu' || this.mode === 'cpu1v1') ?
                  (seat === 'p2' ? 'Adv. CPU' : 'Adv.2 CPU') : seat.toUpperCase();
      rightEl.innerHTML += `<div class="mesa-label">${lbl}</div><div class="mesa-cards">${played ? this.cardHTML(played.card, '', 'small') : '<div class="card small" style="opacity:.15;background:transparent;border:2px dashed #555;box-shadow:none;cursor:default"></div>'}</div>`;
    }

    const st = document.getElementById('status');
    if (this.roundOver) st.textContent = '--';
    else if (this.negotiation) {
      st.textContent = `⚔️ ${this.teamLabel(this.negotiation.raiserTeam)} pediu ${LEVEL_NAME[this.negotiation.proposedLevel].toUpperCase()}`;
    } else {
      const cur = this.currentSeat();
      st.textContent = (this.mode === 'cpu' || this.mode === 'cpu1v1') && cur === 'me'
        ? 'Sua vez' : `Vez: ${this.seatDisplay(cur)}`;
    }

    const sub = document.getElementById('substatus');
    sub.textContent = `${LEVEL_NAME[this.currentLevel]} (${LEVEL_PTS[this.currentLevel]}pt) · vaza ${this.trickNum}/3 · A:${this.trickWins.A} B:${this.trickWins.B}`;

    this.renderControls();
  },

  canHumanPlayNow() {
    if (this.roundOver) return false;
    if (this.negotiation) return false;
    if (this.roundShortCircuit) return false;
    const seat = this.currentSeat();
    if (this.is1v1()) return seat === 'me';
    if (this.mode === 'cpu') return seat === 'me';
    return true;
  },

  renderControls() {
    const el = document.getElementById('controls');
    el.innerHTML = '';
    const add = (t, c, cb, dis=false) => {
      const b = document.createElement('button');
      b.className = `btn ${c}`; b.textContent = t; b.disabled = dis; b.onclick = cb;
      el.appendChild(b);
    };

    if (this.gameOver || this.roundOver) {
      add('▶ Próxima mão', 'gold big', () => this.nextRound());
      add('🏠', 'secondary icon-btn', () => this.backToMenu());
      return;
    }

    const myTeam = this.humanTeam();

    if (this.negotiation) {
      const raiserTeam = this.negotiation.raiserTeam;
      const offeredLevel = this.negotiation.proposedLevel;
      const offeredPts = LEVEL_PTS[offeredLevel];
      const prevPts = LEVEL_PTS[offeredLevel - 1];
      const respTeam = raiserTeam === 'A' ? 'B' : 'A';

      if (respTeam === myTeam) {
        add(`Jogar (aceitar ${offeredPts} pts)`, 'gold big', () => this.respondAccept());
        add(`Correr (perde ${prevPts})`, 'secondary big', () => this.respondFold());
        if (offeredLevel < 4) {
          const raiseTo = offeredLevel + 1;
          add(`Pedir ${LEVEL_NAME[raiseTo]} (${LEVEL_PTS[raiseTo]})`, 'danger big', () => this.respondRaise());
        }
      } else {
        add('⏳ aguardando resposta...', 'secondary', () => {}, true);
      }
      add('🏠', 'secondary icon-btn', () => this.backToMenu());
      return;
    }

    const canCall = this.currentLevel < 4 && this.lastRaiserTeam !== myTeam;
    if (canCall) {
      const nextLevel = this.currentLevel + 1;
      add(`⚔️ Pedir ${LEVEL_NAME[nextLevel]} (${LEVEL_PTS[nextLevel]})`, 'danger big', () => this.humanCallRaise());
    }

    if (!this.canHumanPlayNow() && this.isCpuTurn()) {
      add('⏳ vez do adversário', 'secondary', () => {}, true);
    } else if (!this.canHumanPlayNow() && (this.mode === 'local' || this.mode === 'local2')) {
      add(`⏳ vez: ${this.seatDisplay(this.currentSeat())}`, 'secondary', () => {}, true);
    }

    add('🏠', 'secondary icon-btn', () => this.backToMenu());
  },

  humanCallRaise() {
    const seat = this.currentSeat();
    const myTeam = this.teamOf[seat];
    const nextLvl = this.currentLevel + 1;

    if (nextLvl === 1) { VOZ.play('truco'); flutuar('3 MIO VERDE'); }
    else if (nextLvl === 2) { VOZ.play('seis'); flutuar('6 MIO VERDE'); setTimeout(() => flutuar('CAGANERA'), 800); }
    else if (nextLvl === 3) { VOZ.play('nove'); flutuar('9 CAGANERA'); }
    else if (nextLvl === 4) { VOZ.play('doze'); flutuar('12 CAGANERA'); }

    this.openNegotiation(myTeam, nextLvl);
  },

  openNegotiation(raiserTeam, proposedLevel) {
    if (proposedLevel > 4) return;
    this.negotiation = { raiserTeam, proposedLevel };
    this.lastRaiserTeam = raiserTeam;

    const isHumanRaiser = (raiserTeam === 'A');
    if (!isHumanRaiser) {
      if (proposedLevel === 1) { VOZ.play('truco'); flutuar('3 MIO VERDE'); }
      else if (proposedLevel === 2) { VOZ.play('seis'); flutuar('6 MIO VERDE'); setTimeout(() => flutuar('CAGANERA'), 800); }
      else if (proposedLevel === 3) { VOZ.play('nove'); flutuar('9 CAGANERA'); }
      else if (proposedLevel === 4) { VOZ.play('doze'); flutuar('12 CAGANERA'); }
    }

    this.render();
    this.toast(`⚔️ ${this.teamLabel(raiserTeam)} pediu ${LEVEL_NAME[proposedLevel].toUpperCase()}`);

    const responderTeam = raiserTeam === 'A' ? 'B' : 'A';
    const responderSeat = this.activeSeats().find(s => this.teamOf[s] === responderTeam);
    if (responderSeat && this.isCpuSeat(responderSeat)) {
      setTimeout(() => this.cpuDecide(), 1000);
    }
  },

  cpuDecide() {
    if (!this.negotiation) return;
    const myTeam = this.negotiation.raiserTeam === 'A' ? 'B' : 'A';
    const mySeats = this.activeSeats().filter(s => this.teamOf[s] === myTeam);
    const myCards = mySeats.flatMap(s => this.hands[s] || []);
    const manilhaCount = myCards.filter(c => isManilha(c, this.manilhaValue)).length;
    const maxS = myCards.length ? Math.max(...myCards.map(c => cardStrength(c, this.manilhaValue))) : 0;

    const level = this.negotiation.proposedLevel;
    let foldChance;
    if (manilhaCount >= 2 || maxS >= 997) foldChance = 0.05;
    else if (manilhaCount === 1 || maxS >= 994) foldChance = 0.15 + level * 0.05;
    else foldChance = 0.35 + level * 0.12;
    foldChance = Math.min(foldChance, 0.85);

    const raiseChance = (manilhaCount >= 2 || maxS >= 998) && level < 4 ? 0.35 : 0;

    const roll = Math.random();
    if (roll < foldChance) { this.cpuFold(myTeam); return; }
    if (roll < foldChance + raiseChance) { this.cpuRaise(); return; }
    this.cpuAccept();
  },

  cpuAccept() {
    const proposed = this.negotiation.proposedLevel;
    this.currentLevel = proposed;
    this.negotiation = null;
    this.render();
    this.toast(`✅ vai caganera -- vale ${LEVEL_PTS[proposed]} pts`);
    this.scheduleCpuIfNeeded();
  },

  cpuFold(folderTeam) {
    const proposedLevel = this.negotiation.proposedLevel;
    const paidLevel = proposedLevel - 1;
    const paidPts = LEVEL_PTS[paidLevel];
    const winnerTeam = this.negotiation.raiserTeam;

    this.negotiation = null;
    this.scores[winnerTeam] += paidPts;
    this.trickWins[winnerTeam] = 2;
    this.roundOver = true;

    if (winnerTeam === 'A') {
      VOZ.playSeq('caganera-caganera', 2, 600);
      flutuar('TIQUIRI PIE PIE', '#22ff55');
      setTimeout(() => flutuar('TIQUIRI PIE PIE ', '#22ff55'), 700);
    }

    this.toast(`❌ ${this.teamLabel(folderTeam)} correu -- ${this.teamLabel(winnerTeam)} leva ${paidPts}pt`);
    this.render();
    setTimeout(() => this.endRound(), 900);
  },

  cpuRaise() {
    const offered = this.negotiation.proposedLevel;
    if (offered >= 4) { this.cpuAccept(); return; }
    const newLevel = offered + 1;
    const newRaiser = this.negotiation.raiserTeam === 'A' ? 'B' : 'A';
    this.openNegotiation(newRaiser, newLevel);
  },

  respondAccept() {
    if (!this.negotiation) return;
    const proposed = this.negotiation.proposedLevel;
    this.currentLevel = proposed;
    this.negotiation = null;
    VOZ.play('vai-caganera');
    flutuar('VAI CAGANERA CAGANERA', '#22ff55');
    this.render();
    this.toast(`✅ vai caganera -- vale ${LEVEL_PTS[proposed]} pts`);
    this.scheduleCpuIfNeeded();
  },

  respondFold() {
    if (!this.negotiation) return;
    const proposed = this.negotiation.proposedLevel;
    const paidPts = LEVEL_PTS[proposed - 1];
    const winnerTeam = this.negotiation.raiserTeam;

    this.negotiation = null;
    this.scores[winnerTeam] += paidPts;
    this.trickWins[winnerTeam] = 2;
    this.roundOver = true;
    VOZ.play('nao-vou-querer-seu-facao');
    flutuar('NÃO VOU QUERER SEU FACÃO ZERO', '#ff5555');
    this.toast(`❌ Você correu -- ${this.teamLabel(winnerTeam)} leva ${paidPts}pt`);
    this.render();
    setTimeout(() => this.endRound(), 900);
  },

  respondRaise() {
    if (!this.negotiation) return;
    const offered = this.negotiation.proposedLevel;
    if (offered >= 4) return;
    const newLevel = offered + 1;
    const myTeam = this.negotiation.raiserTeam === 'A' ? 'B' : 'A';

    if (newLevel === 1) { VOZ.play('truco'); flutuar('3 MIO VERDE'); }
    else if (newLevel === 2) { VOZ.play('seis'); flutuar('6 MIO VERDE'); setTimeout(() => flutuar('CAGANERA'), 800); }
    else if (newLevel === 3) { VOZ.play('nove'); flutuar('9 CAGANERA'); }
    else if (newLevel === 4) { VOZ.play('doze'); flutuar('12 CAGANERA'); }

    this.openNegotiation(myTeam, newLevel);
  },

  playCard(seat, card) {
    if (this.roundOver || this.negotiation) return;
    if (this.roundShortCircuit) return;
    this.hands[seat] = this.hands[seat].filter(c => c.id !== card.id);
    this.cardsOnTable.push({ seat, card });
    this.advanceTurn();
  },

  advanceTurn() {
    const needed = this.activeSeats().length;
    if (this.cardsOnTable.length >= needed) {
      this.render();
      setTimeout(() => this.resolveTrick(), 900);
      return;
    }
    let safety = 0;
    do {
      this.turnIdx = (this.turnIdx + 1) % this.seats.length;
      safety++;
    } while (!this.activeSeats().includes(this.seats[this.turnIdx]) && safety < 8);
    this.render();
    this.scheduleCpuIfNeeded();
  },

  scheduleCpuIfNeeded() {
    if (this.roundOver) return;
    if (this.negotiation) return;
    if (this.roundShortCircuit) return;
    const cur = this.currentSeat();
    if (this.isCpuSeat(cur)) setTimeout(() => this.cpuPlay(), 800);
  },

  cpuPlay() {
    if (this.roundOver || this.negotiation) return;
    if (this.roundShortCircuit) return;
    const seat = this.currentSeat();
    if (!this.isCpuSeat(seat)) return;
    const hand = this.hands[seat];
    if (!hand.length) return;

    const myTeam = this.teamOf[seat];
    const partner = this.activeSeats().find(s => s !== seat && this.teamOf[s] === myTeam);
    const partnerCard = partner ? this.cardsOnTable.find(c => c.seat === partner) : null;
    const oppCards = this.cardsOnTable.filter(c => this.teamOf[c.seat] !== myTeam).map(c => c.card);

    const strengths = hand.map(c => ({ c, s: cardStrength(c, this.manilhaValue) })).sort((a,b) => a.s - b.s);

    if (partnerCard) {
      const partnerS = cardStrength(partnerCard.card, this.manilhaValue);
      const maxOpp = oppCards.length ? Math.max(...oppCards.map(c => cardStrength(c, this.manilhaValue))) : 0;
      if (partnerS > maxOpp) { this.playCard(seat, strengths[0].c); return; }
    }

    const allPlayed = this.cardsOnTable.map(c => cardStrength(c.card, this.manilhaValue));
    const maxOnTable = allPlayed.length ? Math.max(...allPlayed) : 0;
    const winner = strengths.find(x => x.s > maxOnTable);
    if (winner) this.playCard(seat, winner.c);
    else this.playCard(seat, strengths[0].c);
  },

  /* ============================================================
     RESOLVE VAZA
     · manilha > qualquer carta comum
     · empate entre DUAS OU MAIS MANILHAS → desempata por naipe
       (paus > copa > espada > ouro)
     · empate entre cartas COMUNS → MELÊ, sem exceção
       (3 contra 3, 2 contra 2, 12 contra 12... sempre empate)
     ============================================================ */
  resolveTrick() {
    const entries = this.cardsOnTable.map(e => ({
      seat: e.seat,
      card: e.card,
      s: cardStrength(e.card, this.manilhaValue),
      man: isManilha(e.card, this.manilhaValue)
    }));

    const maxS = Math.max(...entries.map(x => x.s));
    const top = entries.filter(x => x.s === maxS);

    let winners = top;

    if (top.length > 1) {
      const allManilha = top.every(x => x.man);
      if (allManilha) {
        /* empate só entre manilhas → naipe decide */
        const maxSuit = Math.max(...top.map(x => SUIT_ORDER[x.card.suit]));
        winners = top.filter(x => SUIT_ORDER[x.card.suit] === maxSuit);
      } else {
        /* empate entre cartas comuns → melê (sem exceção) */
        winners = [];
      }
    }

    if (winners.length === 1) {
      const winnerSeat = winners[0].seat;
      const winnerTeam = this.teamOf[winnerSeat];
      this.trickWinner[this.trickNum - 1] = winnerTeam;
      this.turnIdx = this.seats.indexOf(winnerSeat);
      this.toast(`✅ ${this.teamLabel(winnerTeam)} venceu a vaza ${this.trickNum}`);

      const decision = this.decideRound();
      if (decision.over) {
        setTimeout(() => this.endRound(false, decision.winner), 1100);
        return;
      }

      setTimeout(() => {
        this.trickNum++;
        this.cardsOnTable = [];
        this.render();
        this.scheduleCpuIfNeeded();
      }, 1400);
      return;
    }

    /* vaza empatada (melê) */
    this.trickWinner[this.trickNum - 1] = null;
    this.toast(`🪢 Vaza ${this.trickNum} empatada -- melê!`);

    const decision = this.decideRound();
    if (decision.over) {
      setTimeout(() => this.endRound(decision.empachada, decision.winner), 1400);
      return;
    }

    setTimeout(() => {
      this.trickNum++;
      this.cardsOnTable = [];
      this.turnIdx = 0;
      this.render();
      this.scheduleCpuIfNeeded();
    }, 1400);
  },

  /* ============================================================
     DECIDE se a mão acabou e quem venceu
     Regras:
     · vaza 1 decidida + vaza 2 decidida:
        - mesma equipe venceu 1 e 2 → essa equipe leva a mão
        - equipes diferentes → joga vaza 3
        - vaza 2 empatada → quem ganhou a 1 leva a mão (não joga 3)
     · vaza 1 empatada (melê):
        - vaza 2 decidida → quem ganhou a 2 leva a mão (não joga 3)
        - vaza 2 empatada → joga vaza 3
     · 3 vazas empatadas → mão empachada
     ============================================================ */
  decideRound() {
    const w1 = this.trickWinner[0];
    const w2 = this.trickWinner[1];
    const w3 = this.trickWinner[2];
    const tn = this.trickNum;

    /* depois da 1ª vaza, sempre continua */
    if (tn === 1) return { over: false };

    /* depois da 2ª vaza */
    if (tn === 2) {
      if (w1 !== null) {
        /* 1ª decidida + 2ª decidida pela mesma equipe → essa equipe leva */
        if (w2 === w1) return { over: true, winner: w1, empachada: false };
        /* 1ª decidida + 2ª empatada → quem ganhou a 1ª leva a mão (não joga 3) */
        if (w2 === null) return { over: true, winner: w1, empachada: false };
        /* 1ª decidida por uma equipe + 2ª decidida pela outra → joga 3 */
        return { over: false };
      }
      /* 1ª empatada + 2ª decidida → quem ganhou a 2ª leva a mão (não joga 3) */
      if (w2 !== null) return { over: true, winner: w2, empachada: false };
      /* 1ª e 2ª empatadas → joga 3 */
      return { over: false };
    }

    /* depois da 3ª vaza */
    if (tn === 3) {
      if (w3 !== null) return { over: true, winner: w3, empachada: false };
      return { over: true, winner: null, empachada: true };
    }

    return { over: false };
  },

  endRound(empachada = false, winnerForced = null) {
    this.roundOver = true;
    let winnerTeam = winnerForced;
    if (!empachada && winnerTeam === null) {
      if (this.trickWins.A > this.trickWins.B) winnerTeam = 'A';
      else if (this.trickWins.B > this.trickWins.A) winnerTeam = 'B';
    }

    if (!empachada && winnerTeam) {
      const pts = LEVEL_PTS[this.currentLevel];
      this.scores[winnerTeam] += pts;
      if (winnerTeam === 'A') { VOZ.play('vitoria'); flutuar('TIQUIRI PIE PIE !', '#22ff55'); }
      document.getElementById('modalTitle').textContent =
        winnerTeam === 'A' ? '🎉 OS BROCO A venceu!' : '🎉 OS BROCO B venceu!';
      document.getElementById('modalSub').textContent =
        `+${pts} ponto${pts>1?'s':''} (${LEVEL_NAME[this.currentLevel]})`;
    } else {
      document.getElementById('modalTitle').textContent = '🪢 Mão empachada';
      document.getElementById('modalSub').textContent = 'Ninguém pontua -- joga de novo';
    }

    document.getElementById('modalActions').innerHTML = '';
    const btn = document.createElement('button');
    btn.className = 'btn gold';
    const ended = this.scores.A >= 12 || this.scores.B >= 12;
    btn.textContent = ended ? '🏆 Ver resultado' : '▶ Próxima mão';
    btn.onclick = () => {
      document.getElementById('modal').classList.remove('show');
      if (ended) this.endGame();
      else this.nextRound();
    };
    document.getElementById('modalActions').appendChild(btn);
    document.getElementById('modal').classList.add('show');
    this.render();
  },

  endGame() {
    const won = this.scores.A >= 12;
    document.getElementById('modalTitle').textContent = won ? '🏆 OS BROCO A GANHOU!' : '🏆 OS BROCO B GANHOU!';
    document.getElementById('modalSub').textContent = `Placar final: ${this.scores.A} × ${this.scores.B}`;
    document.getElementById('modalActions').innerHTML = '';
    const b1 = document.createElement('button');
    b1.className = 'btn gold'; b1.textContent = '🏠 Menu';
    b1.onclick = () => { document.getElementById('modal').classList.remove('show'); this.backToMenu(); };
    const b2 = document.createElement('button');
    b2.className = 'btn secondary'; b2.textContent = '🔄 Jogar de novo';
    b2.onclick = () => {
      document.getElementById('modal').classList.remove('show');
      this.scores = {A:0,B:0}; this.round = 1; this.gameOver = false; this.reset();
    };
    document.getElementById('modalActions').appendChild(b2);
    document.getElementById('modalActions').appendChild(b1);
    document.getElementById('modal').classList.add('show');
    this.gameOver = true;
  },

  nextRound() {
    this.round++;
    this.roundOver = false;
    this.reset();
  },

  backToMenu() {
    document.getElementById('app').style.display = 'none';
    document.getElementById('startScreen').classList.remove('hide');
    document.getElementById('modal').classList.remove('show');
  },

  start(mode) {
    this.mode = mode;
    this.scores = { A:0, B:0 };
    this.round = 1;
    this.roundOver = false;
    this.gameOver = false;
    document.getElementById('startScreen').classList.add('hide');
    document.getElementById('app').style.display = 'grid';
    this.reset();

    const labels = {
      cpu:      '🤖 Você + Parceiro CPU vs 2 CPU (duplas)',
      cpu1v1:   '🤖 1 Jogador vs 1 CPU',
      local:    '👨‍👩‍👧‍👦 4 Jogadores no mesmo aparelho (duplas)',
      local2:   '👥 2 Jogadores no mesmo aparelho (1v1)'
    };
    this.toast(labels[mode] || 'Jogo iniciado');
  },

  toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), 2400);
  }
};

document.querySelectorAll('.mode-btn').forEach(b => {
  b.onclick = () => { if (!b.disabled) G.start(b.dataset.mode); };
});

/* ---------- contador de visitas ---------- */
(function initVisits() {
  const KEY = 'broco_visits_v1';
  const BASE = 1240;

  let stored = parseInt(localStorage.getItem(KEY) || '0', 10);
  if (isNaN(stored) || stored < BASE) stored = BASE;

  if (!sessionStorage.getItem('broco_counted')) {
    stored += 1 + Math.floor(Math.random() * 3);
    localStorage.setItem(KEY, String(stored));
    sessionStorage.setItem('broco_counted', '1');
  }

  const target = stored;
  const step = Math.max(1, Math.ceil(target / 40));

  function animate(el) {
    if (!el) return;
    let cur = 0;
    const t = setInterval(() => {
      cur += step;
      if (cur >= target) { cur = target; clearInterval(t); }
      el.textContent = cur.toLocaleString('pt-BR');
    }, 30);
  }

  animate(document.getElementById('visitsNum'));
  animate(document.querySelector('.visits-num-2'));
})();
</script>
